name: Newsletter preview

# Builds the weekly email from a pull request and attaches it, so a change to the template can be looked at.
# It needs no keys and is given none: the script reads public site data and writes one HTML file.
# The real email is built and sent from a separate private workflow. Keep it that way: no secrets belong in
# this repo, and this workflow must never use pull_request_target.
on:
  pull_request:
    paths:
      - "newsletter/**"
      - ".github/workflows/newsletter-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node newsletter/newsletter.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newsletter-preview
          path: newsletter.html
