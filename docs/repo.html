<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starwire</title>
<meta name="description" content="Vital signs, alternatives and how it compares, for an open source repo on starwire.">
<meta name="theme-color" content="#141414">
<meta property="og:image" content="https://starwire.foo/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e3b341' d='M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=23">
<script>try{const t=localStorage.getItem("starwire-theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
<style>
  /* this page only, on the site's tokens */
  .rp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 56px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .rp-bar .brand { padding: 0; border: 0; height: auto; }
  .rp-bar .crumb { font-size: 14px; color: var(--muted); text-decoration: none; }
  .rp-bar .crumb:hover { color: var(--text); }
  .rp-bar .sep { color: var(--line); }
  .rp-bar .back { margin-left: auto; font-size: 14px; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
  .rp-bar .back:hover { background: var(--raise); color: var(--text); }
  .rp { max-width: 74rem; margin: 0 auto; padding: 32px 20px 72px; display: flex; flex-direction: column; gap: 40px; }
  .rp h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .rp a:not(.btn) { color: var(--accent); text-decoration: none; }
  .rp a:not(.btn):hover { text-decoration: underline; }
  .hero { display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: center; }
  .hero > img { width: 72px; height: 72px; border-radius: 16px; background: var(--raise); }
  .hero .who { flex: 1 1 28rem; min-width: 0; }
  .hero h1 { margin: 0; font-size: clamp(30px, 5vw, 40px); line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; overflow-wrap: anywhere; }
  .hero h1 small { font-size: 16px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .hero .line { margin: 6px 0 0; font-size: 18px; color: color-mix(in srgb, var(--text) 82%, var(--muted)); max-width: 60ch; }
  .stats { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: color-mix(in srgb, var(--text) 82%, var(--muted)); }
  .stats li { display: flex; align-items: center; gap: 6px; }
  .stats svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stats .star svg { stroke: var(--amber); }
  .stats .up { color: var(--green); }
  .stats b { font-weight: 600; color: var(--text); }
  .stats .up b { color: var(--green); }
  .stats .dot { width: 10px; height: 10px; border-radius: 50%; }
  .acts { display: flex; gap: 8px; }
  .acts .btn { height: 44px; }
  .acts .icon { width: 44px; justify-content: center; padding: 0; }
  .acts .btn[aria-pressed="true"] svg { fill: currentColor; }
  .sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--raise); color: var(--muted); }
  .chip.good { background: var(--green-soft); color: var(--green); }
  .chip.good::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .tiles { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(14rem, calc(50% - 6px)), 1fr)); gap: 12px; }
  @media (max-width: 560px) { .tile { padding: 14px; } .tile .v { font-size: 24px; } .tile .n { font-size: 12px; } .ring svg { width: 48px; height: 48px; } .ring { gap: 10px; } }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--panel); display: flex; flex-direction: column; gap: 12px; }
  .tile .k { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
  .tile .k svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile .v { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .tile .v small { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .tile .n { font-size: 13px; color: var(--muted); }
  .tile.lvl-low .v { color: var(--amber); }
  .lvl-good { --c: var(--green); } .lvl-ok { --c: color-mix(in srgb, var(--green) 45%, var(--muted)); } .lvl-low { --c: var(--amber); } .lvl-none { --c: var(--muted); }
  .rankbar { position: relative; height: 8px; border-radius: 999px; background: var(--raise); }
  .rankbar span { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--c); transform: translateX(-50%); }
  .weeks { height: 40px; display: flex; align-items: flex-end; gap: 4px; }
  .weeks span { flex: 1; min-height: 2px; border-radius: 2px; background: var(--c); opacity: 0.75; }
  .weeks span:last-child { opacity: 1; }
  .timeline { display: flex; align-items: center; height: 40px; gap: 8px; font-size: 12px; color: var(--muted); }
  .timeline i { flex: 1; height: 2px; background: var(--line); position: relative; }
  .timeline i b { position: absolute; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); transform: translateX(-50%); }
  .ring { display: flex; align-items: center; gap: 16px; }
  .ring svg { width: 64px; height: 64px; }
  .foot-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .cmp { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; background: var(--panel); }
  .cmp table { width: 100%; min-width: 46rem; border-collapse: collapse; font-size: 14px; }
  .cmp th, .cmp td { padding: 14px 12px; text-align: left; }
  .cmp th:first-child, .cmp td:last-child { padding-inline: 18px; }
  .cmp thead th { font-size: 13px; font-weight: 500; color: var(--muted); }
  .cmp tbody tr { border-top: 1px solid var(--line); }
  .cmp tbody th { font-weight: 500; }
  .cmp tr.me { background: var(--green-soft); }
  .cmp tr.me th { font-weight: 600; }
  .cmp tr.me th small { margin-left: 6px; font-size: 12px; color: var(--green); }
  .rp .cmp .rp-name { color: var(--text); }
  .cmp .bar { display: flex; align-items: center; gap: 8px; }
  .cmp .bar span { height: 8px; min-width: 3px; border-radius: 999px; background: var(--muted); }
  .cmp tr.me .bar span { background: var(--green); }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 20px; background: var(--panel); }
  .card h2 { font-size: 17px; }
  .swap { margin-top: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .rp .swap a, .rp .swap span { padding: 8px 14px; border-radius: 10px; background: var(--raise); color: var(--text); font-weight: 500; }
  .rp .swap .to { background: var(--green-soft); color: var(--green); font-weight: 600; }
  .swap svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 2; }
  .start { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 10px; }
  .start a, .start button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; padding: 12px 8px; border: 0; border-radius: 10px; background: var(--raise); color: var(--text) !important; font: inherit; font-size: 13px; text-align: center; cursor: pointer; text-decoration: none !important; }
  .start a:hover, .start button:hover { background: color-mix(in srgb, var(--raise) 70%, var(--line)); }
  .start svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tail { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--line); }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topics span { padding: 3px 9px; border-radius: 6px; background: var(--raise); font-size: 13px; color: color-mix(in srgb, var(--text) 75%, var(--muted)); }
  .rp .readme { max-height: none; }
  .missing { text-align: center; padding: 80px 20px; color: var(--muted); }
</style>
</head>

    <span><strong>starwire</strong></span>
  </a>
  <span id="crumbs"></span>
  <a class="back" href="./">Back to the list</a>
</header>

</html>
